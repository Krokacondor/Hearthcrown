<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c8324a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hearthcrown</title>
  </head>
  <body>
    <header id="topbar" class="pelmet" aria-label="Kingdom status">
      <span class="crest">Hearthcrown</span>
      <dl class="stats">
        <div class="stat"><dt>Day</dt><dd data-stat="day">1</dd></div>
        <div class="stat"><dt>Time</dt><dd data-stat="time">6:00</dd></div>
        <div class="stat"><dt>Gold</dt><dd data-stat="gold">100</dd></div>
        <div class="stat stat--meter">
          <dt id="rep-label">Loved · Feared</dt>
          <dd>
            <span class="meter" role="meter" data-stat="reputation" aria-labelledby="rep-label"
              aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Even"></span>
          </dd>
        </div>
      </dl>
    </header>

    <main id="map" tabindex="0" aria-label="Town map. Walk the princess with the walk keys or a controller, or tap a spot; tap someone to talk."></main>

    <nav id="turn" class="turn" aria-label="Camera">
      <button type="button" class="stage-btn" data-turn="left" aria-label="Turn camera left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5" /><path d="M7.5 2.5 7.1 7l4.4.6" /></svg>
      </button>
      <button type="button" class="stage-btn" data-turn="right" aria-label="Turn camera right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5" /><path d="M16.5 2.5l.4 4.5-4.4.6" /></svg>
      </button>
    </nav>

    <button id="build-open" class="stage-btn build-open" type="button" aria-label="Build"
      aria-keyshortcuts="B" aria-controls="build-flat" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5 10 7l6.5 5.5" /><path d="M5.5 11v8.5h9V11" /><path d="M8.5 19.5V15h3v4.5" /><path d="m15.5 3.5 4 4" /><path d="M17.5 5.5 21 2" /><path d="m14 9 3.5-3.5" /></svg>
    </button>

    <aside id="build-flat" class="flat" aria-labelledby="build-title" hidden>
      <header class="flat__head">
        <h2 id="build-title">Build</h2>
        <button type="button" class="flat__back" data-back>Back</button>
      </header>
      <div class="flat__cols" aria-hidden="true"><span>What</span><span>Size</span></div>
      <ul id="build-list" class="flat__list"></ul>
    </aside>

    <div id="bubbles" class="bubbles" aria-hidden="true"></div>

    <section id="dialogue" class="dialogue" role="dialog" aria-labelledby="dialogue-name" hidden>
      <img class="dialogue__portrait" alt="" width="76" height="76" />
      <p class="dialogue__name" id="dialogue-name"></p>
      <p class="dialogue__line"></p>
      <svg class="dialogue__more" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5 12 15.5 18 9.5" /></svg>
    </section>
    <p id="dialogue-live" class="sr-only" aria-live="polite"></p>

    <section id="build-tray" class="tray" aria-label="Placing" hidden>
      <p class="tray__what"><strong data-tray="name"></strong> <span data-tray="size"></span></p>
      <p class="tray__reason" data-tray="reason" aria-live="polite"></p>
      <div class="tray__actions">
        <button type="button" class="tray__btn" data-tray="turn">Turn</button>
        <button type="button" class="tray__btn tray__btn--place" data-tray="place">Place</button>
        <button type="button" class="tray__btn" data-back>Back</button>
      </div>
    </section>

    <div id="no-webgl" class="notice" role="alert" hidden>
      <h1>The town can't be shown here</h1>
      <p>This browser can't draw 3D. Try a recent Chrome, Edge, Firefox or Safari, or turn on hardware acceleration in your browser settings.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
